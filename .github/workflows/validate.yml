name: Проверка курса и приложения
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: dotnet build examples/WinForms/ProgDemo.WinForms.csproj -c Release --nologo
      - run: dotnet build examples/Wpf/ProgDemo.Wpf.csproj -c Release --nologo
      - run: dotnet run --project examples/Import -- materials/resources output/import-check prog_demo_student
      - run: python -B scripts/check_import.py --report output/csv-import-check.json
      - shell: pwsh
        run: |
          $r = Get-Content output/import-check/import-report.json -Raw | ConvertFrom-Json
          if ($r.products -ne 31 -or $r.stock -ne 92 -or $r.sizes -ne 35 -or $r.users -ne 20 -or $r.orders -ne 10 -or $r.lines -ne 30) { throw "Source import counts differ" }
          $sql = Get-Content output/import-check/data.sql -Raw
          if ($sql -match '(?i)\b(CREATE|ALTER|DROP)\b') { throw "Importer must not change structure" }
      - run: npm run build
      - run: npm test
      - run: dotnet run --project examples/Checks
      - uses: actions/upload-artifact@v4
        with:
          name: ProgDemo-Windows
          path: examples/WinForms/bin/Release/net10.0-windows/
      - uses: actions/upload-artifact@v4
        with:
          name: ProgDemo-Course
          path: site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish course
        id: deployment
        uses: actions/deploy-pages@v4
